<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Generatore di auguri</title><style>body{font-family:system-ui,sans-serif;max-width:620px;margin:auto;padding:24px;background:#faf7ff;color:#222}.card{background:#fff;padding:24px;border-radius:22px;box-shadow:0 8px 30px #0001}input,textarea{width:100%;box-sizing:border-box;padding:12px;margin:7px 0 16px;border:1px solid #ddd;border-radius:12px;font-size:16px}button{border:0;border-radius:12px;padding:13px 18px;font-size:16px;cursor:pointer;background:#6d4aff;color:#fff}#result{margin-top:18px;padding:15px;border-radius:14px;background:#f1edff;display:none;word-break:break-all}a{color:#5738d6}</style></head><body><div class="card"><h1>🎁 Generatore di auguri</h1><p>Crea una pagina interattiva e condividi il link.</p><label>Nome</label><input id="name" value="Manuel"><label>Messaggio</label><textarea id="msg" rows="5">Tantissimi auguri! 🎉 Ti auguro una giornata piena di sorrisi, sorprese e cose belle!</textarea><button onclick="generate()">Crea il link</button><div id="result"></div></div><script>function generate(){const n=document.getElementById('name').value.trim()||'Te',m=document.getElementById('msg').value.trim()||'Tantissimi auguri! 🎉';const data=btoa(unescape(encodeURIComponent(JSON.stringify({n,m}))));const url=location.origin+location.pathname.replace(/[^/]*$/,'')+'auguri.html?d='+encodeURIComponent(data);document.getElementById('result').style.display='block';document.getElementById('result').innerHTML='<b>Il tuo link:</b><br><a href="'+url+'">'+url+'</a><br><br><button onclick="navigator.clipboard?.writeText('+JSON.stringify(url)+')">Copia link</button>';}</script></body></html>
