<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Un messaggio per te</title><style>body{font-family:system-ui,sans-serif;margin:0;min-height:100vh;background:linear-gradient(135deg,#fff3f7,#f1edff);display:flex;align-items:center;justify-content:center;text-align:center;color:#222}.card{width:min(90%,520px);background:#fff;padding:34px 22px;border-radius:28px;box-shadow:0 12px 40px #0002}.gift{font-size:80px}.hidden{display:none}.pop{animation:pop .55s ease}button{border:0;border-radius:14px;padding:14px 25px;font-size:17px;cursor:pointer;background:#6d4aff;color:#fff}.msg{font-size:19px;line-height:1.6}@keyframes pop{from{transform:scale(.65);opacity:0}to{transform:scale(1);opacity:1}}</style></head><body><div class="card"><div id="intro"><div class="gift">🎁</div><h1>Un piccolo regalo per te</h1><p>C'è un messaggio speciale...</p><button onclick="openMsg()">Apri 🎀</button></div><div id="final" class="hidden pop"><div style="font-size:55px">🎉💖🎂</div><h1 id="title"></h1><p id="message" class="msg"></p><div style="font-size:42px">🥳🎈✨</div></div></div><script>let data={n:'te',m:'Tantissimi auguri! 🎉'};try{const d=new URLSearchParams(location.search).get('d');if(d)data=JSON.parse(decodeURIComponent(escape(atob(d))))}catch(e){}document.title='Auguri per '+data.n;function openMsg(){document.getElementById('intro').classList.add('hidden');document.getElementById('title').textContent='Tantissimi auguri, '+data.n+'!';document.getElementById('message').textContent=data.m;document.getElementById('final').classList.remove('hidden')}</script></body></html>
